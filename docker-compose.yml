version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: reconhecimento_facial
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - app-network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network

  # Backend API
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # MongoDB
      MONGO_URI: mongodb://admin:password123@mongodb:27017/reconhecimento_facial?authSource=admin
      MONGO_DB_NAME: reconhecimento_facial
      
      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: reconhecimento
      
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_QUEUE: deteccoes
      
      # JWT
      SECRET_KEY: your-super-secret-jwt-key-change-this-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      
      # Diretórios
      IMAGES_DIR: /app/faces_images
      TEMP_DIR: /app/temp
      
    volumes:
      - ./backend/static:/app/static
      - ./backend/faces_images:/app/faces_images
      - ./backend/temp:/app/temp
    depends_on:
      - mongodb
      - minio
      - rabbitmq
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongodb_data:
  minio_data:
  rabbitmq_data:

networks:
  app-network:
    driver: bridge